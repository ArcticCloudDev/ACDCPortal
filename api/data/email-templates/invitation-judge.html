<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background-color: #f3f4f6;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color: #f3f4f6;">
        <tr>
            <td align="center" style="padding: 40px 20px;">
                <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">
                    
                    <!-- ACDC Logo Header -->
                    <tr>
                        <td style="background: linear-gradient(135deg, #1a365d 0%, #2d4a6f 50%, #3b82f6 100%); padding: 30px; text-align: center;">
                            <img src="https://mango-ocean-075da8303.2.azurestaticapps.net/images/ACDCLogo.png" alt="ACDC" style="height: 48px; display: block; margin: 0 auto;">
                        </td>
                    </tr>

                    <!-- Theme Image Header (optional event banner) -->
                    {{#if themeImage}}
                    <tr>
                        <td style="padding: 0;">
                            <img src="{{themeImage}}" alt="Event Theme" style="width: 100%; height: auto; display: block;">
                        </td>
                    </tr>
                    {{/if}}
                    
                    <!-- Content -->
                    <tr>
                        <td style="padding: 40px;">
                            <!-- Title -->
                            <h1 style="margin: 0 0 24px 0; font-size: 28px; font-weight: 700; color: #1e293b; line-height: 1.2;">
                                ⚖️ You're Invited to Judge {{eventName}}
                            </h1>
                            
                            <!-- Body Section (Editable) -->
                            <div style="margin: 0 0 24px 0; font-size: 16px; line-height: 1.6; color: #475569;">
                                {{bodyText}}
                            </div>
                            
                            <!-- Accept Button (bulletproof for Outlook + Gmail) -->
                            <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                                <tr>
                                    <td align="center" style="padding: 20px 0;">
                                        <table role="presentation" cellspacing="0" cellpadding="0">
                                            <tr>
                                                <td align="center" bgcolor="#1e3a5f" style="background-color: #1e3a5f; border-radius: 8px; padding: 18px 50px;">
                                                    <a href="{{acceptUrl}}" style="display: block; color: #ffffff; text-decoration: none; font-size: 18px; font-weight: 600; line-height: 1.2;">
                                                        Accept Judge Invitation
                                                    </a>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>
                            
                            <!-- Expiry notice -->
                            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin-top: 16px;">
                                <tr>
                                    <td align="center">
                                        <div style="display: inline-block; background-color: #fef3c7; padding: 10px 20px; border-radius: 20px;">
                                            <p style="color: #92400e; font-size: 13px; margin: 0; font-weight: 500;">
                                                ⏰ This invitation expires in 7 days
                                            </p>
                                        </div>
                                    </td>
                                </tr>
                            </table>
                            
                            <!-- Closing Section (Editable) -->
                            <div style="margin: 24px 0 0 0; font-size: 16px; line-height: 1.6; color: #475569;">
                                {{closingText}}
                            </div>
                            
                            <!-- Signature -->
                            <div style="margin: 32px 0 0 0; padding-top: 24px; border-top: 1px solid #e2e8f0;">
                                <p style="margin: 0 0 8px 0; font-size: 16px; font-weight: 600; color: #1e293b;">
                                    The {{eventName}} Team
                                </p>
                            </div>
                        </td>
                    </tr>
                    
                    <!-- Footer -->
                    <tr>
                        <td style="padding: 24px 40px; background-color: #f8fafc; border-top: 1px solid #e2e8f0;">
                            <p style="margin: 0; font-size: 12px; line-height: 1.5; color: #64748b; text-align: center;">
                                You received this email because {{inviterName}} invited you to judge {{eventName}}.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
