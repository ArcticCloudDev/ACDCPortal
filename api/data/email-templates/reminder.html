<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reminder: {{subject}}</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1f5f9;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color: #f1f5f9;">
    <tr>
      <td align="center" style="padding: 40px 20px;">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">
          
          <!-- Header with warning/reminder style -->
          <tr>
            <td style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); padding: 40px 40px; text-align: center;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                <tr>
                  <td align="center">
                    <div style="width: 60px; height: 60px; background-color: rgba(255,255,255,0.2); border-radius: 50%; margin: 0 auto 20px; display: inline-block; line-height: 60px;">
                      <span style="font-size: 28px;">⏰</span>
                    </div>
                    <h1 style="color: #ffffff; margin: 0; font-size: 24px; font-weight: 600;">Reminder</h1>
                    <p style="color: #fef3c7; margin: 10px 0 0; font-size: 16px; font-weight: 500;">{{subject}}</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          
          <!-- Countdown/Date highlight -->
          <tr>
            <td style="padding: 0;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                <tr>
                  <td align="center" style="background-color: #fffbeb; padding: 20px; border-bottom: 1px solid #fde68a;">
                    <p style="color: #92400e; font-size: 14px; margin: 0; font-weight: 600;">
                      📅 {{eventDate}}
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          
          <!-- Main Content -->
          <tr>
            <td style="padding: 40px;">
              <p style="color: #334155; font-size: 16px; line-height: 1.6; margin: 0 0 20px;">
                Hi {{firstName}},
              </p>
              
              <div style="color: #334155; font-size: 16px; line-height: 1.7;">
                {{content}}
              </div>
              
              <!-- Action items box -->
              {{#if actionItems}}
              <div style="background-color: #fefce8; border: 1px solid #fde68a; padding: 20px; margin: 30px 0; border-radius: 8px;">
                <p style="color: #854d0e; font-size: 14px; margin: 0 0 10px; font-weight: 600;">📋 Action Items:</p>
                <div style="color: #713f12; font-size: 14px; line-height: 1.6;">
                  {{actionItems}}
                </div>
              </div>
              {{/if}}
              
              <!-- CTA Button (bulletproof for Outlook + Gmail) -->
              {{#if ctaUrl}}
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                <tr>
                  <td align="center" style="padding: 20px 0;">
                    <table role="presentation" cellspacing="0" cellpadding="0">
                      <tr>
                        <td align="center" bgcolor="#d97706" style="background-color: #d97706; border-radius: 8px; padding: 18px 50px;">
                          <a href="{{ctaUrl}}" style="display: block; color: #ffffff; text-decoration: none; font-size: 18px; font-weight: 600; line-height: 1.2;">
                            {{ctaText}}
                          </a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
              {{/if}}
            </td>
          </tr>
          
          <!-- Footer -->
          <tr>
            <td style="background-color: #f8fafc; padding: 30px 40px; border-top: 1px solid #e2e8f0;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                <tr>
                  <td align="center">
                    <p style="color: #94a3b8; font-size: 13px; margin: 0 0 10px;">
                      Arctic Cloud Developer Challenge
                    </p>
                    <p style="color: #cbd5e1; font-size: 12px; margin: 0;">
                      You're receiving this because you're registered for ACDC.
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
