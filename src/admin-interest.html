<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interest Queue - ACDC Committee</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛰️</text></svg>">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/admin-styles.css">
    <style>        .stats-row { display: flex; gap: 16px; margin-bottom: 20px; }

        .stat-card {
            background: white;
            border: 1px solid var(--admin-border);
            border-radius: 8px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 140px;
        }

        .stat-card .icon {
            width: 40px; height: 40px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem;
        }

        .stat-card .icon.blue { background: #dbeafe; color: #2563eb; }
        .stat-card .icon.green { background: #d1fae5; color: #059669; }
        .stat-card .icon.amber { background: #fef3c7; color: #d97706; }
        .stat-card .icon.purple { background: #ede9fe; color: #7c3aed; }

        .stat-card .info .value { font-size: 1.5rem; font-weight: 700; color: var(--admin-sidebar); line-height: 1; }
        .stat-card .info .label { font-size: 0.75rem; color: var(--admin-text-muted); margin-top: 2px; }

        .panel {
            background: white;
            border-radius: 8px;
            border: 1px solid var(--admin-border);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            border-bottom: 1px solid var(--admin-border);
        }

        .panel-title { font-size: 0.9rem; font-weight: 600; color: var(--admin-sidebar); }

        .filter-tabs {
            display: flex;
            gap: 8px;
        }

        .filter-tab {
            padding: 6px 12px;
            border: 1px solid var(--admin-border);
            background: white;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .filter-tab:hover { background: var(--admin-bg); }
        .filter-tab.active { background: var(--admin-primary); border-color: var(--admin-primary); color: white; }

        .data-table { width: 100%; border-collapse: collapse; }

        .data-table th {
            text-align: left;
            padding: 10px 16px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--admin-text-muted);
            background: var(--admin-bg);
            border-bottom: 1px solid var(--admin-border);
        }

        .data-table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--admin-border);
            font-size: 0.85rem;
        }

        .data-table tbody tr:hover { background: var(--admin-bg); }
        .data-table tbody tr:last-child td { border-bottom: none; }

        .badge {
            display: inline-flex;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
        }

        .badge.pending { background: #fef3c7; color: #92400e; }
        .badge.notified { background: #dbeafe; color: #1d4ed8; }
        .badge.registered { background: #d1fae5; color: #065f46; }

        .btn-sm {
            padding: 5px 10px;
            font-size: 0.75rem;
            border-radius: 4px;
            border: 1px solid var(--admin-border);
            background: white;
            color: var(--admin-text);
            cursor: pointer;
            text-decoration: none;
        }

        .btn-sm:hover { background: var(--admin-bg); }
        .btn-sm.primary { background: var(--admin-primary); border-color: var(--admin-primary); color: white; }
        .btn-sm.primary:hover { background: #2563eb; }
        .btn-sm.danger { color: var(--admin-danger); border-color: var(--admin-danger); }
        .btn-sm.danger:hover { background: #fef2f2; }

        .actions { display: flex; gap: 6px; }

        .empty-state { padding: 40px; text-align: center; color: var(--admin-text-muted); }

        .bulk-actions {
            display: flex;
            gap: 10px;
            padding: 12px 18px;
            background: #f8fafc;
            border-bottom: 1px solid var(--admin-border);
        }

        .copy-link {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--admin-bg);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .copy-link input {
            border: none;
            background: transparent;
            flex: 1;
            font-size: 0.85rem;
            color: var(--admin-text-muted);
        }

        .copy-link button {
            padding: 4px 8px;
            border: 1px solid var(--admin-border);
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div class="page-header">
                <h1 class="page-title">Interest Queue</h1>
                <div class="copy-link">
                    <span>Share link:</span>
                    <input type="text" id="share-link" readonly>
                    <button type="button" id="copy-share-link-btn">Copy</button>
                </div>
            </div>

            <div class="stats-row">
                <div class="stat-card">
                    <div class="icon blue">📋</div>
                    <div class="info">
                        <div class="value" id="stat-total">0</div>
                        <div class="label">Total</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="icon purple">✓</div>
                    <div class="info">
                        <div class="value" id="stat-verified">0</div>
                        <div class="label">Verified</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="icon green">✅</div>
                    <div class="info">
                        <div class="value" id="stat-converted">0</div>
                        <div class="label">Converted</div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">Interest Leads - All Events</span>
                </div>
                <div class="bulk-actions" id="bulk-actions" style="display: none;">
                    <button type="button" class="btn-sm" id="export-selected-btn">📥 Export Selected</button>
                    <span id="selected-count" style="margin-left: auto; color: var(--admin-text-muted);">0 selected</span>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="select-all"></th>
                            <th>#</th>
                            <th>Email</th>
                            <th>Name</th>
                            <th>Event</th>
                            <th>Signed Up</th>
                            <th>Status</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="queue-table-body">
                        <tr><td colspan="8" class="empty-state">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/admin-utils.js"></script>
    <script src="js/admin-sidebar.js"></script>
    <script src="js/permissions.js"></script>
    <script src="js/admin-interest.js"></script>
</body>
</html>
