<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Person lookup - ACDC Admin</title>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/admin-styles.css">
</head>
<body class="page-person">
    <div class="admin-layout">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <nav class="breadcrumb hidden" id="person-breadcrumb" aria-label="Breadcrumb">
                <a href="admin-users.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="/images/icons.svg#arrow-left"></use></svg>People</a>
            </nav>

            <div class="page-header">
                <div>
                    <h1 class="page-title">Person lookup</h1>
                    <p class="page-subtitle">Look up anyone by email to see their events, roles and teams.</p>
                </div>
            </div>

            <div class="toolbar person-search" role="search">
                <div class="search-field">
                    <svg class="icon" aria-hidden="true" focusable="false"><use href="/images/icons.svg#search"></use></svg>
                    <label for="search-email" class="visually-hidden">Email address</label>
                    <input type="email" id="search-email" placeholder="name@example.com"
                           autocomplete="off" spellcheck="false">
                </div>
                <button type="button" class="btn btn-primary" id="search-btn">Look up</button>
            </div>

            <div id="results-container">
                <div class="panel">
                    <div class="empty-state">
                        <span class="empty-state-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="/images/icons.svg#user-round"></use></svg></span>
                        <h2 class="empty-state-title">Look up a person</h2>
                        <p>Enter an email address to see their history across all events.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/admin-utils.js"></script>
    <script src="js/admin-sidebar.js"></script>
    <script src="js/permissions.js"></script>
    <script src="js/admin-person.js"></script>
</body>
</html>
