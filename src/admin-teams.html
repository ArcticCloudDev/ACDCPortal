<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams - ACDC Admin</title>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/admin-styles.css">
</head>
<body>
    <div class="admin-layout">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div id="loading" class="acdc-loader">
                <div class="loader-spinner"></div>
                <div class="loader-text">Loading teams...</div>
            </div>

            <div id="admin-content" class="hidden">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">Teams</h1>
                        <p class="page-subtitle">Every registered team with its members and pending invitations</p>
                    </div>
                </div>

                <div class="stats-row stats-compact">
                    <div class="stat-card">
                        <div class="stat-icon tone-accent"><svg class="icon" aria-hidden="true" focusable="false"><use href="/images/icons.svg#users"></use></svg></div>
                        <div class="stat-content">
                            <div class="stat-value" id="total-teams">0</div>
                            <div class="stat-label">Teams</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon tone-accent"><svg class="icon" aria-hidden="true" focusable="false"><use href="/images/icons.svg#user-check"></use></svg></div>
                        <div class="stat-content">
                            <div class="stat-value" id="total-participants">0</div>
                            <div class="stat-label">Participants</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon tone-neutral"><svg class="icon" aria-hidden="true" focusable="false"><use href="/images/icons.svg#ticket"></use></svg></div>
                        <div class="stat-content">
                            <div class="stat-value" id="total-committed">0</div>
                            <div class="stat-label">Committed places</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon tone-neutral"><svg class="icon" aria-hidden="true" focusable="false"><use href="/images/icons.svg#chart-pie"></use></svg></div>
                        <div class="stat-content">
                            <div class="stat-value" id="fill-rate">0%</div>
                            <div class="stat-label">Fill rate</div>
                        </div>
                    </div>
                </div>

                <div class="toolbar">
                    <div class="search-field">
                        <svg class="icon" aria-hidden="true" focusable="false"><use href="/images/icons.svg#search"></use></svg>
                        <label for="search-teams" class="visually-hidden">Search teams</label>
                        <input type="search" id="search-teams" placeholder="Search by team or admin">
                    </div>
                    <label for="event-filter" class="visually-hidden">Event</label>
                    <select id="event-filter">
                        <option value="">All events</option>
                    </select>
                </div>

                <section class="panel">
                    <div class="panel-body">
                        <table class="data-table teams-table">
                            <thead>
                                <tr>
                                    <th scope="col">Team</th>
                                    <th scope="col">Event</th>
                                    <th scope="col">Admin</th>
                                    <th scope="col">Members</th>
                                    <th scope="col">Created</th>
                                    <th scope="col"><span class="visually-hidden">Actions</span></th>
                                </tr>
                            </thead>
                            <tbody id="teams-table-body">
                                <tr><td colspan="6" class="empty-state">Loading teams...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>

            <div id="not-committee" class="access-denied hidden">
                <h2>Access denied</h2>
                <p class="page-subtitle">You do not have committee access.</p>
                <p><a href="events.html" class="btn-sm primary">Go to events</a></p>
            </div>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin-utils.js"></script>
    <script src="js/admin-sidebar.js"></script>
    <script src="js/permissions.js"></script>
    <script src="js/admin-teams.js"></script>
</body>
</html>
