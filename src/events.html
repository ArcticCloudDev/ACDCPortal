<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACDC Portal</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛰️</text></svg>">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Event grid */
        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        /* Event cards — standalone, compact */
        .event-card {
            border-radius: 12px;
            padding: 20px;
            text-align: left;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: box-shadow 0.2s;
        }
        .event-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }
        .event-card.pre-registration {
            background: #fffdf5;
        }
        .event-card.registration {
            background: #f7fdf9;
        }

        /* Status pill */
        .event-card .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 3px 10px;
            border-radius: 100px;
            margin-bottom: 10px;
        }
        .event-card.pre-registration .status-badge {
            background: #fef3c7;
            color: #92400e;
        }
        .event-card.registration .status-badge {
            background: #d1fae5;
            color: #065f46;
        }

        .event-card h3 {
            margin: 0 0 4px;
            font-size: 1.15rem;
            color: #1e293b;
        }
        .event-card .event-meta {
            font-size: 0.8rem;
            color: #64748b;
            margin: 0 0 4px;
        }
        .event-card .description {
            font-size: 0.85rem;
            color: #475569;
            margin: 0 0 12px;
            line-height: 1.4;
        }

        /* Action buttons row */
        .event-card .btn-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .event-card .btn-event {
            display: inline-block;
            padding: 9px 18px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            transition: opacity 0.15s;
        }
        .event-card .btn-event:hover {
            opacity: 0.88;
        }
        .btn-event.primary {
            background: #059669;
            color: white;
        }
        .btn-event.secondary {
            background: #ca8a04;
            color: white;
        }
        .btn-event.interest-only {
            background: #ca8a04;
            color: white;
        }

        .event-card .helper-text {
            font-size: 0.75rem;
            color: #94a3b8;
            margin: 8px 0 0;
        }

        /* Banner CSS now in css/styles.css */

        .my-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            padding: 4px 10px;
            border-radius: 100px;
            margin-bottom: 8px;
        }
        .my-status-pill.interest {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }
        .my-status-pill.team {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #93c5fd;
        }
        .event-status-row {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .event-status-row .status-badge,
        .event-status-row .my-status-pill {
            margin-bottom: 0;
        }
        .event-status-row .my-status-pill {
            margin-left: auto;
        }
        .no-events-message {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
        }

    </style>
</head>
<body>
    <div class="container">
        <header id="site-header"></header>

        <main class="landing">
                <!-- Event section - dynamically populated -->
                <div id="events-section">
                    <div class="acdc-loader">
                        <div class="loader-spinner"></div>
                        <div class="loader-text">Loading events...</div>
                    </div>
                </div>
        </main>

        <footer>
            <p>&copy; 2026 ACDC Portal</p>
        </footer>
    </div>
    
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/site-header.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Initialize Auth
            Auth.init();

            // Render shared header
            SiteHeader.render({ containerId: 'site-header' });

            let authUser = null;
            let currentUser = null;
            let participationByEventId = new Map();
            let interestLeadEventIds = new Set();
            let isAdmin = false;
            
            // Start the SQL wake-up timer immediately so it shows even while auth/user calls are pending
            const eventsSection = document.getElementById('events-section');
            let pageLoadDone = false;
            const wakeupTimer = setTimeout(() => {
                if (pageLoadDone) return;
                eventsSection.innerHTML = `
                    <div class="acdc-loader">
                        <div class="loader-spinner"></div>
                        <div class="loader-text">Loading events...</div>
                        <div class="loader-wake">
                            <span class="wake-emoji">\ud83d\ude34</span> Our database is hibernating like a polar bear in the Arctic winter.
                            Give it a moment to wake up, stretch, and fetch your events. This can take up to a minute.
                        </div>
                    </div>
                `;
            }, 1200);

            // Check for invitation link parameter and store it
            const urlParams = new URLSearchParams(window.location.search);
            const inviteId = urlParams.get('invite');
            if (inviteId) {
                console.log('Storing invitation ID:', inviteId);
                sessionStorage.setItem('pendingInvitation', inviteId);
            }
            
            // Setup auth actions and load user context for interest/team status badges
            try {
                authUser = Auth.isLoggedIn() ? Auth.getUser() : null;
                SiteHeader.update({ authUser });

                if (authUser?.email) {
                    currentUser = await API.users.getOrNull(authUser.email);
                    
                    if (currentUser?.id) {
                        try {
                            const participationData = await API.participations.getOrNull(currentUser.id);
                            if (participationData) {
                                const participationList = Array.isArray(participationData) ? participationData : [participationData];
                                participationList.filter(Boolean).forEach(participation => {
                                    if (participation.eventId) {
                                        participationByEventId.set(participation.eventId, participation);
                                    }
                                    // Check if user has admin roles
                                    const roles = participation?.roles || [];
                                    if (roles.includes('committee') || roles.includes('judge')) {
                                        isAdmin = true;
                                    }
                                });
                            }
                        } catch (e) {
                            console.log('Could not load participations for event status badges:', e);
                        }

                        try {
                            const leadsResp = await fetch(`${API.baseUrl}/interest/leads?verified=true`);
                            if (leadsResp.ok) {
                                const leadsData = await leadsResp.json();
                                const leads = Array.isArray(leadsData) ? leadsData : (leadsData.leads || []);
                                leads
                                    .filter(lead => lead.email?.toLowerCase() === currentUser.email.toLowerCase())
                                    .forEach(lead => interestLeadEventIds.add(lead.eventId));
                            }
                        } catch (e) {
                            console.log('Could not load interest leads for badges:', e);
                        }
                    }

                    SiteHeader.update({ authUser, user: currentUser, isAdmin });
                }
            } catch (error) {
                console.error('Auth/user context error:', error);
            }
            
            // If this is an invitation link, redirect to the dedicated acceptance page
            if (inviteId) {
                try {
                    const invitation = await API.invitations.get(inviteId);
                    if (invitation && invitation.status === 'pending' && !invitation.isExpired) {
                        // Role invites (judge/committee) still show inline page
                        if (invitation.role && invitation.role !== 'participant') {
                            showRoleInvitationPage(invitation);
                            return;
                        }
                        // Team invites redirect to dedicated acceptance page
                        window.location.href = `accept-invitation.html?invite=${inviteId}`;
                        return;
                    }
                } catch (err) {
                    console.log('Could not load invitation:', err);
                }
            }
            
            // Regular page: load events + sign-in section
            await loadEvents();
            SiteHeader.update({ authUser, user: currentUser, isAdmin });
            
            // ============================================================
            // ROLE-BASED INVITE: Dedicated acceptance page (judge/committee)
            // ============================================================
            function showRoleInvitationPage(invitation) {
                const isJudge = invitation.role === 'judge';
                const roleLabel = isJudge ? 'Judge' : 'Committee Member';
                const roleIcon = isJudge ? '⚖️' : '🏛️';
                const accentColor = isJudge ? '#92400e' : '#1e40af';
                const bgGradient = isJudge 
                    ? 'linear-gradient(135deg, #fef3c7 0%, #fde68a 100%)' 
                    : 'linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%)';
                const borderColor = isJudge ? '#d97706' : '#2563eb';
                const btnBg = isJudge ? '#b45309' : '#1d4ed8';
                const btnHover = isJudge ? '#92400e' : '#1e40af';
                
                // Format event dates
                let eventMeta = '';
                if (invitation.eventStartDate || invitation.eventLocation) {
                    const parts = [];
                    if (invitation.eventStartDate) {
                        parts.push(`📅 ${formatDateRange(invitation.eventStartDate, invitation.eventEndDate)}`);
                    }
                    if (invitation.eventLocation) {
                        parts.push(`📍 ${invitation.eventLocation}`);
                    }
                    eventMeta = `<p style="margin: 12px 0 0; font-size: 0.9rem; color: #64748b;">${parts.join(' • ')}</p>`;
                }
                
                const mainEl = document.querySelector('main.landing');
                mainEl.innerHTML = `
                    <div class="card" style="max-width: 500px; margin: 0 auto;">
                        <!-- Role invitation header -->
                        <div style="background: ${bgGradient}; border-radius: 12px; padding: 28px; margin-bottom: 24px; text-align: center;">
                            <div style="font-size: 2.5rem; margin-bottom: 12px;">${roleIcon}</div>
                            <h2 style="margin: 0 0 8px; color: ${accentColor}; font-size: 1.3rem;">
                                ${roleLabel} Invitation
                            </h2>
                            <p style="margin: 0; color: #475569; font-size: 1rem; line-height: 1.5;">
                                <strong>${invitation.inviterName}</strong> has invited you to serve as a 
                                <strong style="color: ${accentColor};">${roleLabel}</strong> for
                            </p>
                            <p style="margin: 8px 0 0; font-size: 1.2rem; font-weight: 700; color: ${accentColor};">
                                ${invitation.eventName || 'this event'}
                            </p>
                            ${eventMeta}
                        </div>
                        
                        <!-- Single clear CTA -->
                        <div style="text-align: center; padding: 0 20px;">
                            <p style="margin: 0 0 20px; color: #475569; font-size: 0.95rem; line-height: 1.5;">
                                Click the button below to accept and complete your registration. 
                                We'll send a one-time code to your email — no password needed.
                            </p>
                            <button id="accept-role-btn" style="
                                display: inline-block;
                                width: 100%;
                                padding: 16px 32px;
                                background: ${btnBg};
                                color: white;
                                border: none;
                                border-radius: 10px;
                                font-size: 1.05rem;
                                font-weight: 600;
                                cursor: pointer;
                                transition: background 0.2s;
                            ">
                                ${roleIcon} Accept ${roleLabel} Invitation
                            </button>
                            <p style="margin: 16px 0 0; font-size: 0.8rem; color: #94a3b8;">
                                This invitation expires ${formatExpiry(invitation.expiresAt)}
                            </p>
                        </div>
                    </div>
                `;
                
                // Button hover effect
                const btn = document.getElementById('accept-role-btn');
                btn.addEventListener('mouseenter', () => btn.style.background = btnHover);
                btn.addEventListener('mouseleave', () => btn.style.background = btnBg);
                btn.addEventListener('click', async () => {
                    try {
                        await Auth.login();
                    } catch (error) {
                        console.error('Sign-in error:', error);
                        alert('Error signing in. Please try again.');
                    }
                });
            }
            
            function formatExpiry(dateStr) {
                if (!dateStr) return 'soon';
                const expiry = new Date(dateStr);
                const now = new Date();
                const days = Math.ceil((expiry - now) / (1000 * 60 * 60 * 24));
                if (days <= 0) return 'soon';
                if (days === 1) return 'tomorrow';
                return `in ${days} days`;
            }
            
            // ============================================================
            // REGULAR PAGE: Events list + sign-in
            // ============================================================
            
            async function loadEvents() {
                const section = document.getElementById('events-section');

                try {
                    const response = await fetch(`${CONFIG.api.baseUrl}/events`);
                    if (!response.ok) throw new Error('Failed to load events');
                    
                    const events = await response.json();
                    pageLoadDone = true;
                    clearTimeout(wakeupTimer);
                    
                    // Get events that are in pre-registration or registration status
                    const activeEvents = events.filter(e => 
                        e.status === 'pre-registration' || e.status === 'registration'
                    );
                    
                    if (activeEvents.length === 0) {
                        section.innerHTML = `
                            <div class="no-events-message">
                                <h2 style="margin-bottom: 12px;">Welcome!</h2>
                                <p>No events are currently open for registration.</p>
                                <p style="margin-top: 8px;">Check back later or sign in to see your profile.</p>
                            </div>
                        `;
                        return null;
                    }
                    
                    section.innerHTML = '<div class="events-grid">' + activeEvents.map(event => {
                        const participation = participationByEventId.get(event.id) || null;
                        const roles = participation?.roles || [];
                        const isInterestRegistered = roles.includes('interest') || interestLeadEventIds.has(event.id);
                        const isJudge = roles.includes('judge');
                        const isCommittee = roles.includes('committee');
                        const hasTeam = !!participation?.teamId;

                        const isPreReg = event.status === 'pre-registration';
                        const statusIcon = isPreReg ? '🔔' : '✅';
                        const statusText = isPreReg ? 'Coming Soon' : 'Registration Open';
                        const statusPill = hasTeam
                            ? '<div class="my-status-pill team">✓ Team Registered</div>'
                            : isInterestRegistered
                                ? '<div class="my-status-pill interest">✓ Interest Registered</div>'
                                : '';
                        
                        const meta = `📅 ${formatDateRange(event.startDate, event.endDate)}${event.location ? ` · 📍 ${event.location}` : ''}`;
                        const desc = event.description ? `<p class="description">${event.description}</p>` : '';
                        
                        // Determine if user already has any relationship with this event
                        const hasRelationship = hasTeam || isJudge || isCommittee || isInterestRegistered;

                        let actions = '';
                        let helperText = '';

                        if (hasRelationship) {
                            // Single "Open" button for anyone with existing involvement
                            actions = `<a href="event.html?id=${event.id}" class="btn-event primary">Open</a>`;
                            helperText = '';
                        } else if (isPreReg) {
                            actions = `<a href="register.html?intent=interest&eventId=${event.id}" class="btn-event interest-only">Register Interest</a>`;
                            helperText = '<p class="helper-text">Be the first to know when registration opens!</p>';
                        } else {
                            actions = `
                                <a href="register.html?intent=team&eventId=${event.id}" class="btn-event primary">Register Team</a>
                                <a href="register.html?intent=interest&eventId=${event.id}" class="btn-event secondary">Register Interest</a>
                            `;
                            helperText = '<p class="helper-text">Register your team or express interest to stay informed</p>';
                        }

                        return `
                            <div class="event-card ${isPreReg ? 'pre-registration' : 'registration'}">
                                <div class="event-status-row">
                                    <div class="status-badge">${statusIcon} ${statusText}</div>
                                    ${statusPill}
                                </div>
                                <h3>${event.name}</h3>
                                ${desc}
                                <p class="event-meta">${meta}</p>
                                <div class="btn-row">
                                    ${actions}
                                </div>
                                ${helperText}
                            </div>
                        `;
                    }).join('') + '</div>';
                    
                    return activeEvents[0]?.id || null;
                    
                } catch (error) {
                    pageLoadDone = true;
                    clearTimeout(wakeupTimer);
                    console.error('Error loading events:', error);
                    section.innerHTML = `
                        <div class="no-events-message">
                            <h2 style="margin-bottom: 12px;">Welcome!</h2>
                            <p>Unable to load events. Please try again later.</p>
                        </div>
                    `;
                    return null;
                }
            }
            
            function formatDateRange(start, end) {
                const startDate = new Date(start);
                const endDate = new Date(end);
                
                if (startDate.getMonth() === endDate.getMonth() && startDate.getFullYear() === endDate.getFullYear()) {
                    return `${startDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} - ${endDate.getDate()}, ${endDate.getFullYear()}`;
                }
                return `${startDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })} - ${endDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
            }
        });
    </script>
</body>
</html>
