<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACDC Portal</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛰️</text></svg>">
    <link rel="stylesheet" href="css/styles.css">
    <style>        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        .event-card {
            border-radius: 12px;
            padding: 20px;
            text-align: left;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: box-shadow 0.2s;
        }
        .event-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }
        .event-card.pre-registration {
            background: #fffdf5;
        }
        .event-card.registration {
            background: #f7fdf9;
        }
        .event-card.live {
            background: #f5f3ff;
        }

        .event-card .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 3px 10px;
            border-radius: 100px;
            margin-bottom: 10px;
        }
        .event-card.pre-registration .status-badge {
            background: #fef3c7;
            color: #92400e;
        }
        .event-card.registration .status-badge {
            background: #d1fae5;
            color: #065f46;
        }
        .event-card.live .status-badge {
            background: #ede9fe;
            color: #5b21b6;
        }

        .event-card h3 {
            margin: 0 0 4px;
            font-size: 1.15rem;
            color: #1e293b;
        }
        .event-card .event-meta {
            font-size: 0.8rem;
            color: #64748b;
            margin: 0 0 4px;
        }
        .event-card .description {
            font-size: 0.85rem;
            color: #475569;
            margin: 0 0 12px;
            line-height: 1.4;
        }

        .event-card .btn-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .event-card .btn-event {
            display: inline-block;
            padding: 9px 18px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            transition: opacity 0.15s;
        }
        .event-card .btn-event:hover {
            opacity: 0.88;
        }
        .btn-event.primary {
            background: #059669;
            color: white;
        }
        .btn-event.secondary {
            background: #ca8a04;
            color: white;
        }
        .btn-event.interest-only {
            background: #ca8a04;
            color: white;
        }

        .event-card .helper-text {
            font-size: 0.75rem;
            color: #94a3b8;
            margin: 8px 0 0;
        }

        .my-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            padding: 4px 10px;
            border-radius: 100px;
            margin-bottom: 8px;
        }
        .my-status-pill.interest {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }
        .my-status-pill.team {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #93c5fd;
        }
        .event-status-row {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .event-status-row .status-badge,
        .event-status-row .my-status-pill {
            margin-bottom: 0;
        }
        .event-status-row .my-status-pill {
            margin-left: auto;
        }
        .no-events-message {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
        }

    </style></head>
<body>
    <div class="container">
        <header id="site-header"></header>

        <main class="landing">
                <div id="events-section">
                    <div class="acdc-loader">
                        <div class="loader-spinner"></div>
                        <div class="loader-text">Loading events...</div>
                    </div>
                </div>
        </main>

        <footer>
            <p>&copy; 2026 ACDC Portal</p>
        </footer>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/site-header.js"></script>
    <script src="js/events.js"></script>
</body>
</html>
