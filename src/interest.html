<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Interest - ACDC Portal</title>
    <script>
        // Redirect to unified register page, preserving eventId
        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('eventId') || params.get('event');
        const target = eventId
            ? `register.html?intent=interest&eventId=${encodeURIComponent(eventId)}`
            : 'register.html?intent=interest';
        window.location.replace(target);
    </script>
</head>
<body>
    <p>Redirecting to registration...</p>
</body>
</html>
