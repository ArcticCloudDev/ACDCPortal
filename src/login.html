<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ACDC Portal</title>
    <script>
        // login.html now redirects to the unified register/sign-in page
        // Preserves query params (email, redirect) for seamless handoff
        const params = new URLSearchParams(window.location.search);
        const target = 'register.html' + (params.toString() ? '?' + params.toString() : '');
        window.location.replace(target);
    </script>
</head>
<body>
    <p>Redirecting to sign in...</p>
</body>
</html>
