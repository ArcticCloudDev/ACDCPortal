<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Registration - ACDC Portal</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛰️</text></svg>">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏔️ ACDC Portal</h1>
            <p class="subtitle">Complete Your Registration</p>
        </header>

        <main>
            <div id="loading" class="card acdc-loader">
                <div class="loader-spinner"></div>
                <div class="loader-text">Loading registration...</div>
            </div>

            <div id="registration-card" class="card hidden">
                <div id="invitation-banner" class="hidden" style="border-radius: 12px; padding: 20px; margin-bottom: 24px;">
                    <p style="margin: 0 0 8px; font-weight: 600;" id="invitation-title"></p>
                    <p style="margin: 0; color: #475569;" id="invitation-details"></p>
                    <p style="margin: 8px 0 0; color: #64748b; font-size: 14px;" id="invitation-helper"></p>
                </div>
                <h2>Welcome! Let's get you set up</h2>
                <p>Please complete your profile to continue.</p>
                
                <form id="complete-registration-form">
                    <fieldset>
                        <legend>Personal Information</legend>
                        
                        <div class="form-group">
                            <label for="firstName">First Name *</label>
                            <input type="text" id="firstName" name="firstName" required 
                                   placeholder="Enter your first name">
                        </div>
                        
                        <div class="form-group">
                            <label for="lastName">Last Name *</label>
                            <input type="text" id="lastName" name="lastName" required
                                   placeholder="Enter your last name">
                        </div>
                        
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" readonly class="readonly">
                        </div>
                        
                        <div class="form-group">
                            <label for="phone">Phone *</label>
                            <input type="tel" id="phone" name="phone" required
                                   placeholder="Enter your phone number">
                        </div>
                    </fieldset>

                    <div id="form-error" class="error-message hidden"></div>
                    
                    <button type="submit" class="btn btn-primary btn-large" id="complete-btn">
                        <span class="btn-text">Complete Registration</span>
                        <span class="btn-loading hidden">Completing...</span>
                    </button>
                </form>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 ACDC Portal</p>
        </footer>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/complete-registration.js"></script>
</body>
</html>
