<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Registration - ACDC Portal</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛰️</text></svg>">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏔️ ACDC Portal</h1>
            <p class="subtitle">Complete Your Registration</p>
        </header>

        <main>
            <div id="loading" class="card acdc-loader">
                <div class="loader-spinner"></div>
                <div class="loader-text">Loading registration...</div>
            </div>

            <div id="registration-card" class="card hidden">
                <div id="invitation-banner" class="hidden" style="border-radius: 12px; padding: 20px; margin-bottom: 24px;">
                    <p style="margin: 0 0 8px; font-weight: 600;" id="invitation-title"></p>
                    <p style="margin: 0; color: #475569;" id="invitation-details"></p>
                    <p style="margin: 8px 0 0; color: #64748b; font-size: 14px;" id="invitation-helper"></p>
                </div>
                <h2>Welcome! Let's get you set up</h2>
                <p>Please complete your profile to continue.</p>
                
                <form id="complete-registration-form">
                    <fieldset>
                        <legend>Personal Information</legend>
                        
                        <div class="form-group">
                            <label for="firstName">First Name *</label>
                            <input type="text" id="firstName" name="firstName" required 
                                   placeholder="Enter your first name">
                        </div>
                        
                        <div class="form-group">
                            <label for="lastName">Last Name *</label>
                            <input type="text" id="lastName" name="lastName" required
                                   placeholder="Enter your last name">
                        </div>
                        
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" readonly class="readonly">
                        </div>
                        
                        <div class="form-group">
                            <label for="phone">Phone *</label>
                            <input type="tel" id="phone" name="phone" required
                                   placeholder="Enter your phone number">
                        </div>
                    </fieldset>

                    <div id="form-error" class="error-message hidden"></div>
                    
                    <button type="submit" class="btn btn-primary btn-large" id="complete-btn">
                        <span class="btn-text">Complete Registration</span>
                        <span class="btn-loading hidden">Completing...</span>
                    </button>
                </form>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 ACDC Portal</p>
        </footer>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const loadingDiv = document.getElementById('loading');
            const wakeTimer = setTimeout(() => {
                if (loadingDiv.classList.contains('hidden')) return;
                if (!loadingDiv.querySelector('.loader-wake')) {
                    loadingDiv.insertAdjacentHTML('beforeend', '<div class="loader-wake"><span class="wake-scene"><span class="wake-bear">🐻‍❄️</span> <span class="wake-zzz">💤</span></span><div class="wake-title">Waking up the Arctic Database<span class="wake-dots"></span></div>Our polar bear database keeper is hibernating! Give it a moment to wake up and stretch. This can take up to a minute.<div class="wake-subtitle">☕ Brewing some Arctic coffee to speed things up...</div></div>');
                }
            }, 1200);
            const registrationCard = document.getElementById('registration-card');
            const form = document.getElementById('complete-registration-form');
            
            let currentUser = null;
            const redirect = new URLSearchParams(window.location.search).get('redirect') || 'events.html';

            // Initialize Auth
            Auth.init();
            
            try {
                await Auth.handleRedirect();
                
                if (!Auth.isLoggedIn()) {
                    window.location.href = '/register.html';
                    return;
                }
                
                const authUser = Auth.getUser();
                
                // Try to load existing user or create new one
                try {
                    currentUser = await API.users.get(authUser.email);
                    
                    // If profile is already complete, continue the originating flow.
                    if (currentUser.profileComplete) {
                        window.location.href = redirect;
                        return;
                    }
                } catch (error) {
                    // User doesn't exist - create a minimal record
                    currentUser = {
                        id: generateId(),
                        email: authUser.email,
                        firstName: '',
                        lastName: '',
                        phone: '',
                        profileComplete: false,
                        createdAt: new Date().toISOString()
                    };
                    await API.users.create(currentUser);
                }
                
                // Pre-fill email
                document.getElementById('email').value = authUser.email;
                
                // Pre-fill name if available from token
                if (authUser.name && authUser.name !== authUser.email) {
                    const nameParts = authUser.name.split(' ');
                    document.getElementById('firstName').value = nameParts[0] || '';
                    document.getElementById('lastName').value = nameParts.slice(1).join(' ') || '';
                }
                
                // Check for pending invitation and show banner
                const inviteId = sessionStorage.getItem('pendingInvitation');
                if (inviteId) {
                    try {
                        const invitation = await API.invitations.get(inviteId);
                        if (invitation && invitation.status === 'pending' && !invitation.isExpired) {
                            const banner = document.getElementById('invitation-banner');
                            const titleEl = document.getElementById('invitation-title');
                            const detailsEl = document.getElementById('invitation-details');
                            const helperEl = document.getElementById('invitation-helper');
                            
                            if (invitation.role === 'judge') {
                                banner.style.background = 'linear-gradient(135deg, #fef3c7 0%, #fde68a 100%)';
                                banner.style.borderLeft = '4px solid #d97706';
                                titleEl.style.color = '#92400e';
                                titleEl.textContent = '⚖️ Judge Invitation';
                                detailsEl.innerHTML = `<strong>${invitation.inviterName}</strong> invited you to serve as a <strong style="color: #92400e;">Judge</strong> for <strong style="color: #92400e;">${invitation.eventName || 'the event'}</strong>`;
                                helperEl.textContent = 'Complete your profile below to accept the judge invitation.';
                            } else if (invitation.role === 'committee') {
                                banner.style.background = 'linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%)';
                                banner.style.borderLeft = '4px solid #2563eb';
                                titleEl.style.color = '#1e40af';
                                titleEl.textContent = '🏛️ Committee Invitation';
                                detailsEl.innerHTML = `<strong>${invitation.inviterName}</strong> invited you to join the <strong style="color: #1e40af;">Committee</strong> for <strong style="color: #1e40af;">${invitation.eventName || 'the event'}</strong>`;
                                helperEl.textContent = 'Complete your profile below to accept the committee invitation.';
                            } else {
                                banner.style.background = 'linear-gradient(135deg, #dbeafe 0%, #e0f2fe 100%)';
                                banner.style.borderLeft = '4px solid #2563eb';
                                titleEl.style.color = '#1e40af';
                                titleEl.textContent = '🎉 You\'ve been invited to join a team!';
                                detailsEl.innerHTML = `<strong>${invitation.inviterName}</strong> invited you to join team <strong style="color: #1e40af;">${invitation.teamName}</strong>`;
                                helperEl.textContent = 'Complete your profile below to accept the invitation.';
                            }
                            
                            banner.classList.remove('hidden');
                        }
                    } catch (err) {
                        console.log('Could not load invitation:', err);
                    }
                }
                
                // Show form
                loadingDiv.classList.add('hidden');
                clearTimeout(wakeTimer);
                registrationCard.classList.remove('hidden');
                
            } catch (error) {
                console.error('Error:', error);
                loadingDiv.innerHTML = `<p class="error-message">Error: ${error.message}</p>
                                       <a href="/events.html" class="btn btn-primary">Back to Events</a>`;
            }

            function generateId() {
                return crypto.randomUUID();
            }

            // Form submission
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const completeBtn = document.getElementById('complete-btn');
                const errorDiv = document.getElementById('form-error');
                
                const formData = {
                    firstName: document.getElementById('firstName').value.trim(),
                    lastName: document.getElementById('lastName').value.trim(),
                    phone: document.getElementById('phone').value.trim()
                };
                
                // Validate
                if (!formData.firstName || !formData.lastName || !formData.phone) {
                    errorDiv.textContent = 'Please fill in all fields.';
                    errorDiv.classList.remove('hidden');
                    return;
                }
                
                // Show loading
                completeBtn.disabled = true;
                completeBtn.querySelector('.btn-text').classList.add('hidden');
                completeBtn.querySelector('.btn-loading').classList.remove('hidden');
                errorDiv.classList.add('hidden');
                
                try {
                    // Update user profile
                    await API.users.update(currentUser.id, {
                        firstName: formData.firstName,
                        lastName: formData.lastName,
                        phone: formData.phone,
                        profileComplete: true
                    });
                    
                    // Continue the flow that required profile completion.
                    window.location.href = redirect;
                    
                } catch (error) {
                    errorDiv.textContent = error.message || 'Registration failed. Please try again.';
                    errorDiv.classList.remove('hidden');
                    
                    completeBtn.disabled = false;
                    completeBtn.querySelector('.btn-text').classList.remove('hidden');
                    completeBtn.querySelector('.btn-loading').classList.add('hidden');
                }
            });
        });
    </script>
</body>
</html>
