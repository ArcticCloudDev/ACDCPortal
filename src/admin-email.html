<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Composer - ACDC Committee</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛰️</text></svg>">
    <link rel="stylesheet" href="css/admin-styles.css">
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <style>
        /* Page-specific styles */

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 220px;
            padding: 24px 32px;
        }

        .page-header {
            margin-bottom: 20px;
        }

        .page-title { font-size: 1.5rem; font-weight: 600; color: var(--admin-sidebar); margin: 0; }

        /* Status Bar */
        .status-bar {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        .status-bar.error { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; display: block; }
        .status-bar.success { background: #dcfce7; border: 1px solid #86efac; color: #166534; display: block; }
        .status-bar.warning { background: #fef3c7; border: 1px solid #fde68a; color: #92400e; display: block; }

        /* Email Container */
        .email-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        /* Panels */
        .panel {
            background: white;
            border-radius: 8px;
            border: 1px solid var(--admin-border);
        }

        .panel-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--admin-border);
            font-weight: 600;
            color: var(--admin-sidebar);
        }

        .panel-body { padding: 18px; }

        /* Form Elements */
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 0.85rem; }

        .form-group input[type="text"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--admin-border);
            border-radius: 6px;
            font-size: 0.875rem;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--admin-primary);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }

        /* Template Cards */
        .template-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .template-card {
            padding: 12px 8px;
            border: 2px solid var(--admin-border);
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s;
        }

        .template-card:hover { border-color: var(--admin-primary); }
        .template-card.selected { border-color: var(--admin-primary); background: rgba(59,130,246,0.05); }
        .template-card .icon { font-size: 1.25rem; margin-bottom: 4px; }
        .template-card .name { font-size: 0.7rem; font-weight: 500; }

        /* Recipient Info */
        .recipient-info {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            padding: 4px 10px;
            background: #dbeafe;
            color: #1d4ed8;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        /* Custom Recipients */
        .custom-recipients { display: none; margin-top: 8px; }
        .custom-recipients.visible { display: block; }
        .custom-recipients textarea { height: 80px; font-family: monospace; font-size: 0.8rem; }

        /* Quill Editor */
        #editor-container { height: 200px; background: white; }
        .ql-toolbar { border-radius: 6px 6px 0 0 !important; background: #f8fafc; }
        .ql-container { border-radius: 0 0 6px 6px !important; }

        /* Preview Frame */
        .preview-frame {
            width: 100%;
            height: calc(100vh - 200px);
            min-height: 500px;
            border: 1px solid var(--admin-border);
            border-radius: 6px;
            background: white;
        }

        /* Buttons */
        .btn-row { display: flex; gap: 10px; margin-top: 16px; }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-primary { background: var(--admin-primary); color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-secondary { background: var(--admin-border); color: var(--admin-text); }
        .btn-secondary:hover { background: #cbd5e1; }

        .btn-sm {
            padding: 5px 10px;
            font-size: 0.75rem;
            border-radius: 4px;
            border: 1px solid var(--admin-border);
            background: white;
            color: var(--admin-text);
            cursor: pointer;
        }
        .btn-sm:hover { background: var(--admin-bg); }

        /* History Section */
        .history-section { margin-top: 24px; }

        .data-table { width: 100%; border-collapse: collapse; }

        .data-table th {
            text-align: left;
            padding: 10px 16px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--admin-text-muted);
            background: var(--admin-bg);
            border-bottom: 1px solid var(--admin-border);
        }

        .data-table td {
            padding: 10px 16px;
            border-bottom: 1px solid var(--admin-border);
            font-size: 0.85rem;
        }

        .data-table tbody tr:hover { background: var(--admin-bg); }

        .badge {
            display: inline-flex;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 500;
            text-transform: uppercase;
        }

        .badge-success { background: #dcfce7; color: #166534; }
        .badge-warning { background: #fef3c7; color: #92400e; }
        .badge-error { background: #fee2e2; color: #991b1b; }

        .empty-state { text-align: center; padding: 30px; color: var(--admin-text-muted); }
    </style>
</head>
<body>
    <div class="admin-layout">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div class="page-header">
                <h1 class="page-title">Email Composer</h1>
            </div>

            <div id="status-bar" class="status-bar"></div>

            <div class="email-container">
                <!-- Compose Panel -->
                <div class="panel">
                    <div class="panel-header">Compose Email</div>
                    <div class="panel-body">
                        <div class="form-group">
                            <label>Template</label>
                            <div class="template-grid" id="template-cards">
                                <div class="template-card selected" data-template="announcement">
                                    <div class="icon">📢</div>
                                    <div class="name">Announcement</div>
                                </div>
                                <div class="template-card" data-template="reminder">
                                    <div class="icon">⏰</div>
                                    <div class="name">Reminder</div>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="subject">Subject</label>
                            <input type="text" id="subject" placeholder="Enter email subject...">
                        </div>

                        <div class="form-group">
                            <label>Target Event</label>
                            <select id="event-select" style="width: 100%;">
                                <option value="">Loading events...</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Recipients</label>
                            <select id="recipient-filter" style="width: 100%;">
                                <option value="all-participants">All Participants</option>
                                <option value="team-admins">Team Admins Only</option>
                                <option value="team-members">Team Members (non-admins)</option>
                                <option value="solo-queue">Solo Queue Participants</option>
                                <option value="pending-invites">Pending Invitations</option>
                                <option value="interest-queue">Interest Queue (No Event)</option>
                                <option value="custom">Custom List</option>
                            </select>
                            <div class="custom-recipients" id="custom-recipients">
                                <textarea id="custom-emails" placeholder="Enter email addresses, one per line..."></textarea>
                            </div>
                            <div class="recipient-info">
                                <span id="recipient-count">0</span> recipients selected
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Message Content</label>
                            <div id="editor-container"></div>
                        </div>

                        <div class="form-group">
                            <label for="cta-url">Call-to-Action URL (optional)</label>
                            <input type="text" id="cta-url" placeholder="https://...">
                        </div>

                        <div class="form-group">
                            <label for="cta-text">Button Text</label>
                            <input type="text" id="cta-text" placeholder="Learn More" value="Learn More">
                        </div>

                        <div class="form-group">
                            <label>Status *</label>
                            <div style="display: flex; gap: 16px; margin-top: 8px;">
                                <label style="display: flex; align-items: center; cursor: pointer;">
                                    <input type="radio" name="email-status" value="draft" checked style="margin-right: 6px;">
                                    <span>📝 Draft (save without sending)</span>
                                </label>
                                <label style="display: flex; align-items: center; cursor: pointer;">
                                    <input type="radio" name="email-status" value="live" style="margin-right: 6px;">
                                    <span>✅ Live (will send)</span>
                                </label>
                            </div>
                        </div>

                        <div class="form-group" id="schedule-group" style="display: none;">
                            <label>Send On (optional) <span id="timezone-display" style="font-weight: normal; color: var(--admin-text-muted);"></span></label>
                            <input type="datetime-local" id="scheduled-send-time">
                            <p style="font-size: 0.85rem; color: var(--admin-text-muted); margin-top: 4px;">
                                Leave empty to send immediately when status changes to Live.
                            </p>
                            <p id="schedule-preview" style="font-size: 0.85rem; color: var(--admin-accent); margin-top: 8px; padding: 8px; background: var(--admin-bg-secondary); border-radius: 4px; display: none;"></p>
                        </div>

                        <div class="btn-row">
                            <button class="btn btn-secondary" onclick="previewEmail()">👁️ Preview</button>
                            <button class="btn btn-primary" onclick="sendEmail()" id="send-btn">📤 Send Email</button>
                            <button class="btn btn-secondary" onclick="cancelSequenceEdit()" id="cancel-btn" style="display: none;">Cancel</button>
                        </div>
                    </div>
                </div>

                <!-- Preview Panel -->
                <div class="panel">
                    <div class="panel-header">Preview</div>
                    <div class="panel-body" style="padding: 0;">
                        <iframe id="preview-frame" class="preview-frame"></iframe>
                    </div>
                </div>
            </div>

            <!-- History Section -->
            <div class="history-section">
                <div class="panel">
                    <div class="panel-header">Send History</div>
                    <table class="data-table">
                        <thead id="history-header">
                            <tr>
                                <th>Date</th>
                                <th>Subject</th>
                                <th>Template</th>
                                <th>Recipients</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="history-body">
                            <tr><td colspan="5" class="empty-state">Loading history...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/admin-sidebar.js"></script>
    <script src="js/permissions.js"></script>
    <script>
        let quill;
        let selectedTemplate = 'announcement';
        let recipients = [];
        let allEvents = [];
        let currentPermissions = null;
        
        // Sequence mode detection
        const urlParams = new URLSearchParams(window.location.search);
        const isSequenceMode = urlParams.get('mode') === 'sequence';
        const sequenceId = urlParams.get('sequenceId');
        const eventId = urlParams.get('eventId');
        const emailId = urlParams.get('emailId');
        const emailOrder = parseInt(urlParams.get('order')) || 1;

        document.addEventListener('DOMContentLoaded', async () => {
            // Resolve permissions (handles auth check, sidebar render, access denied)
            currentPermissions = await Permissions.initAdminPage('email');

            if (!currentPermissions) return;
            
            // Initialize rich text editor
            quill = new Quill('#editor-container', {
                theme: 'snow',
                placeholder: 'Write your message here...',
                modules: {
                    toolbar: [
                        ['bold', 'italic', 'underline'],
                        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                        ['link'],
                        ['clean']
                    ]
                }
            });

            // Template selection
            document.querySelectorAll('.template-card').forEach(card => {
                card.addEventListener('click', () => {
                    document.querySelectorAll('.template-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    selectedTemplate = card.dataset.template;
                    previewEmail();
                });
            });

            // Event selection change
            document.getElementById('event-select').addEventListener('change', () => {
                if (!isSequenceMode) {
                    loadRecipients();
                }
            });

            // Recipient filter change
            document.getElementById('recipient-filter').addEventListener('change', (e) => {
                const customRecipients = document.getElementById('custom-recipients');
                customRecipients.classList.toggle('visible', e.target.value === 'custom');

                if (e.target.value !== 'custom' && !isSequenceMode) {
                    loadRecipients();
                }
            });

            document.getElementById('custom-emails').addEventListener('input', parseCustomEmails);

            // Status change handler
            document.querySelectorAll('input[name="email-status"]').forEach(radio => {
                radio.addEventListener('change', (e) => {
                    if (e.target.value === 'live') {
                        document.getElementById('schedule-group').style.display = 'block';
                        displayUserTimezone();
                    } else {
                        document.getElementById('schedule-group').style.display = 'none';
                        lockFormFields(false);
                    }
                });
            });

            // Schedule change handler
            document.getElementById('scheduled-send-time').addEventListener('change', updateSchedulePreview);
            document.getElementById('scheduled-send-time').addEventListener('input', updateSchedulePreview);

            // Auto-preview on content change
            quill.on('text-change', debounce(previewEmail, 500));
            document.getElementById('subject').addEventListener('input', debounce(previewEmail, 500));
            document.getElementById('cta-url').addEventListener('input', debounce(previewEmail, 500));
            document.getElementById('cta-text').addEventListener('input', debounce(previewEmail, 500));

            // Initial load
            await loadEvents();
            
            // If sequence mode, load the email data and lock fields
            if (isSequenceMode) {
                await loadSequenceEmail();
                
                // Update button UI for sequence mode
                const sendBtn = document.getElementById('send-btn');
                const cancelBtn = document.getElementById('cancel-btn');
                sendBtn.textContent = emailId ? '💾 Update Email' : '💾 Save Email';
                cancelBtn.style.display = 'inline-block';
            } else {
                await loadRecipients();
            }
            
            // Load history for both modes
            await loadHistory();
            
            previewEmail();
        });
        
        function cancelSequenceEdit() {
            window.location.href = `admin-events.html?id=${eventId}&tab=sequence`;
        }
        
        async function loadSequenceEmail() {
            try {
                // Lock event selector
                const eventSelect = document.getElementById('event-select');
                eventSelect.value = eventId;
                eventSelect.disabled = true;
                eventSelect.style.background = 'var(--admin-bg)';
                eventSelect.style.cursor = 'not-allowed';
                
                // Lock recipient filter to event-contacts (all event-related contacts)
                const recipientFilter = document.getElementById('recipient-filter');
                recipientFilter.innerHTML = '<option value="event-contacts">Event Contacts (All)</option>';
                recipientFilter.disabled = true;
                recipientFilter.style.background = 'var(--admin-bg)';
                recipientFilter.style.cursor = 'not-allowed';
                
                // Load event contacts for count
                await loadRecipients();
                
                // If editing existing email, load its data
                if (emailId) {
                    const response = await fetch(`${CONFIG.api.baseUrl}/email/campaigns/${emailId}`);
                    if (response.ok) {
                        const data = await response.json();
                        const email = data.campaign;
                        const sentCount = data.stats?.sent || 0;
                        
                        document.getElementById('subject').value = email.subject;
                        quill.clipboard.dangerouslyPasteHTML(email.content || '');
                        
                        // Set template - use template field if exists, or handle old campaigns with type="sequence"
                        selectedTemplate = email.template || email.type || 'announcement';
                        if (selectedTemplate === 'sequence') {
                            selectedTemplate = 'announcement'; // Default for old campaigns
                        }
                        document.querySelector(`[data-template="${selectedTemplate}"]`)?.classList.add('selected');
                        
                        // Set CTA fields
                        if (email.ctaUrl) document.getElementById('cta-url').value = email.ctaUrl;
                        if (email.ctaText) document.getElementById('cta-text').value = email.ctaText;
                        
                        // Set status
                        if (email.status) {
                            document.querySelector(`input[name="email-status"][value="${email.status}"]`).checked = true;
                            if (email.status === 'live') {
                                document.getElementById('schedule-group').style.display = 'block';
                                displayUserTimezone();
                                // Only lock if the email has actually been delivered
                                if (sentCount > 0) {
                                    lockFormFields(true);
                                }
                            }
                        }
                        
                        // Set schedule
                        if (email.scheduledSendTime) {
                            const localDate = new Date(email.scheduledSendTime);
                            const offset = localDate.getTimezoneOffset();
                            const localISO = new Date(localDate.getTime() - offset * 60000).toISOString().slice(0, 16);
                            document.getElementById('scheduled-send-time').value = localISO;
                            updateSchedulePreview();
                        }
                    }
                }
            } catch (error) {
                console.error('Error loading sequence email:', error);
                showStatus('Error loading email data', 'error');
            }
        }

        async function loadEvents() {
            try {
                const response = await fetch(`${CONFIG.api.baseUrl}/events`);
                if (response.ok) {
                    let events = await response.json();
                    // Scope events to permitted events for non-admin users
                    allEvents = Permissions.filterByEvent(currentPermissions, events, 'id');
                    const select = document.getElementById('event-select');
                    
                    // Sort: active first, then by date
                    allEvents.sort((a, b) => {
                        if (a.isActive && !b.isActive) return -1;
                        if (!a.isActive && b.isActive) return 1;
                        return new Date(b.startDate) - new Date(a.startDate);
                    });

                    select.innerHTML = allEvents.map(event => 
                        `<option value="${event.id}" ${event.isActive ? 'selected' : ''}>${event.name}${event.isActive ? ' (Active)' : ''}</option>`
                    ).join('');

                    if (allEvents.length === 0) {
                        select.innerHTML = '<option value="">No events found</option>';
                    }
                }
            } catch (error) {
                console.error('Error loading events:', error);
                document.getElementById('event-select').innerHTML = '<option value="">Error loading events</option>';
            }
        }

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        async function loadRecipients() {
            const eventId = document.getElementById('event-select').value;
            const filter = document.getElementById('recipient-filter').value;

            // Event contacts includes all event-related contacts (for sequence mode)
            if (filter === 'event-contacts') {
                if (!eventId) {
                    recipients = [];
                    document.getElementById('recipient-count').textContent = '0';
                    return;
                }
                try {
                    // Load all event-related contacts (teams, interest leads, judges, etc.)
                    const response = await fetch(`${CONFIG.api.baseUrl}/email/recipients?eventId=${eventId}&filter=all-event-contacts`);
                    if (!response.ok) throw new Error('Failed to load');
                    recipients = await response.json();
                    document.getElementById('recipient-count').textContent = recipients.length;
                } catch (error) {
                    console.error('Error loading event contacts:', error);
                    recipients = [];
                    document.getElementById('recipient-count').textContent = '0';
                }
                return;
            }

            // Interest queue doesn't require an event - load all interest leads
            if (filter === 'interest-queue') {
                try {
                    const response = await fetch(`${CONFIG.api.baseUrl}/interest/leads`);
                    if (!response.ok) throw new Error('Failed to load');
                    const data = await response.json();
                    const leads = data.leads || [];
                    // Only include verified leads
                    recipients = leads
                        .filter(l => l.verified)
                        .map(l => ({
                            email: l.email,
                            displayName: [l.firstName, l.lastName].filter(Boolean).join(' ') || l.email
                        }));
                    document.getElementById('recipient-count').textContent = recipients.length;
                } catch (error) {
                    console.error('Error loading interest leads:', error);
                    recipients = [];
                    document.getElementById('recipient-count').textContent = '0';
                }
                return;
            }

            if (!eventId) {
                recipients = [];
                document.getElementById('recipient-count').textContent = '0';
                return;
            }

            try {
                const response = await fetch(`${CONFIG.api.baseUrl}/email/recipients?eventId=${eventId}&filter=${filter}`);
                if (!response.ok) throw new Error('Failed to load');
                recipients = await response.json();
                document.getElementById('recipient-count').textContent = recipients.length;
            } catch (error) {
                console.error('Error loading recipients:', error);
                recipients = [];
                document.getElementById('recipient-count').textContent = '0';
            }
        }

        function parseCustomEmails() {
            const text = document.getElementById('custom-emails').value;
            const emails = text.split('\n')
                .map(e => e.trim())
                .filter(e => e && e.includes('@'));
            recipients = emails.map(email => ({ email }));
            document.getElementById('recipient-count').textContent = recipients.length;
        }

        async function previewEmail() {
            const subject = document.getElementById('subject').value || 'Email Subject';
            const content = quill.root.innerHTML;
            const ctaUrl = document.getElementById('cta-url').value;
            const ctaText = document.getElementById('cta-text').value || 'Learn More';

            try {
                const response = await fetch(`${CONFIG.api.baseUrl}/email/preview`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        templateId: selectedTemplate,
                        data: {
                            subject: subject,
                            firstName: 'Preview User',
                            content: content,
                            ctaUrl: ctaUrl,
                            ctaText: ctaText
                        }
                    })
                });

                if (response.ok) {
                    const result = await response.json();
                    const frame = document.getElementById('preview-frame');
                    frame.srcdoc = result.html;
                }
            } catch (error) {
                console.error('Error previewing email:', error);
            }
        }

        async function sendEmail() {
            // If in sequence mode, save to campaigns instead of sending
            if (isSequenceMode) {
                return await saveSequenceEmail();
            }
            
            if (recipients.length === 0) {
                showStatus('Please select recipients', 'error');
                return;
            }

            const subject = document.getElementById('subject').value;
            if (!subject) {
                showStatus('Please enter a subject', 'error');
                return;
            }

            if (!confirm(`Send email to ${recipients.length} recipient(s)?`)) {
                return;
            }

            const status = document.querySelector('input[name="email-status"]:checked').value;
            const scheduleInput = document.getElementById('scheduled-send-time').value;
            const scheduledSendTime = scheduleInput ? new Date(scheduleInput).toISOString() : null;
            
            try {
                const response = await fetch(`${CONFIG.api.baseUrl}/email/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        templateId: selectedTemplate,
                        subject,
                        content: quill.root.innerHTML,
                        ctaUrl: document.getElementById('cta-url').value,
                        ctaText: document.getElementById('cta-text').value || 'Learn More',
                        status,
                        scheduledSendTime,
                        recipients: recipients.map(r => ({
                            email: r.email,
                            name: r.displayName || r.email
                        }))
                    })
                });

                const result = await response.json();

                if (result.results.failed === 0) {
                    showStatus(`✅ Successfully sent to ${result.results.sent} recipient(s)`, 'success');
                } else {
                    showStatus(`⚠️ Sent: ${result.results.sent}, Failed: ${result.results.failed}`, 'warning');
                }

                await loadHistory();
            } catch (error) {
                console.error('Error sending email:', error);
                showStatus('Error sending email: ' + error.message, 'error');
            }
        }
        
        async function saveSequenceEmail() {
            const subject = document.getElementById('subject').value;
            if (!subject) {
                showStatus('Please enter a subject', 'error');
                return;
            }
            
            const content = quill.root.innerHTML;
            if (!content || content === '<p><br></p>') {
                showStatus('Please enter email content', 'error');
                return;
            }
            
            const status = document.querySelector('input[name="email-status"]:checked').value;
            const scheduleInput = document.getElementById('scheduled-send-time').value;
            const scheduledSendTime = scheduleInput ? new Date(scheduleInput).toISOString() : null;
            
            const emailData = {
                sequenceId: sequenceId,
                subject: subject,
                content: content,
                template: selectedTemplate, // Store template name for preview
                type: 'sequence', // Keep type as 'sequence' for filtering
                status: status,
                scheduledSendTime: scheduledSendTime,
                ctaUrl: document.getElementById('cta-url').value,
                ctaText: document.getElementById('cta-text').value || 'Learn More'
            };
            // Only set sequenceOrder on creation — never overwrite it on update
            // (order only changes via the reorder buttons on the sequence editor)
            if (!emailId) {
                emailData.sequenceOrder = emailOrder;
            }
            
            try {
                let response;
                if (emailId) {
                    // Update existing email
                    response = await fetch(`${CONFIG.api.baseUrl}/campaigns/${emailId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(emailData)
                    });
                } else {
                    // Create new email
                    response = await fetch(`${CONFIG.api.baseUrl}/campaigns`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(emailData)
                    });
                }
                
                if (response.ok) {
                    showStatus('✅ Email saved successfully', 'success');
                    
                    // Redirect back to event's sequence tab
                    setTimeout(() => {
                        window.location.href = `admin-events.html?event=${eventId}&tab=sequence`;
                    }, 1000);
                } else {
                    const error = await response.json();
                    showStatus('❌ Failed to save: ' + (error.error || 'Unknown error'), 'error');
                }
            } catch (error) {
                console.error('Error saving sequence email:', error);
                showStatus('❌ Error saving email: ' + error.message, 'error');
            }
        }

        async function loadHistory() {
            console.log('[loadHistory] Starting to load email history');
            try {
                const tbody = document.getElementById('history-body');
                const thead = document.getElementById('history-header');
                
                // If we're viewing a specific sequence email, show deliveries for THIS email only
                if (isSequenceMode && emailId) {
                    console.log('[loadHistory] Loading deliveries for campaign:', emailId);
                    
                    // Update table headers for individual deliveries
                    thead.innerHTML = `
                        <tr>
                            <th>Date & Time</th>
                            <th>Recipient</th>
                            <th>Send Type</th>
                            <th></th>
                            <th>Status</th>
                        </tr>
                    `;
                    
                    const response = await fetch(`${CONFIG.api.baseUrl}/deliveries/event/${eventId}`);
                    
                    if (!response.ok) {
                        throw new Error(`Deliveries not available: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    console.log('[loadHistory] Received deliveries data:', data);
                    
                    // Filter deliveries for this specific campaign
                    const thisEmailDeliveries = data.deliveries.filter(d => d.campaignId === emailId);
                    console.log('[loadHistory] Filtered to', thisEmailDeliveries.length, 'deliveries for this email');
                    
                    if (thisEmailDeliveries.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="5" class="empty-state">Not sent yet</td></tr>`;
                        return;
                    }
                    
                    // Show individual recipient deliveries
                    tbody.innerHTML = thisEmailDeliveries.map(delivery => {
                        const date = new Date(delivery.sentAt || delivery.createdAt).toLocaleDateString();
                        const time = new Date(delivery.sentAt || delivery.createdAt).toLocaleTimeString();
                        const statusClass = delivery.status === 'sent' ? 'success' : 
                                          delivery.status === 'failed' ? 'error' : 'warning';
                        const statusText = delivery.status === 'sent' ? 'Sent' : 
                                         delivery.status === 'failed' ? 'Failed' : 'Pending';
                        
                        return `
                            <tr>
                                <td>${date} ${time}</td>
                                <td>${delivery.email}</td>
                                <td>Sequence</td>
                                <td></td>
                                <td><span class="badge badge-${statusClass}">${statusText}</span></td>
                            </tr>
                        `;
                    }).join('');
                    
                    console.log('[loadHistory] Rendered', thisEmailDeliveries.length, 'deliveries');
                    return;
                }
                
                // Otherwise show general email log (quick emails + campaign summaries)
                // Update table headers for summary view
                thead.innerHTML = `
                    <tr>
                        <th>Date</th>
                        <th>Subject</th>
                        <th>Template</th>
                        <th>Recipients</th>
                        <th>Status</th>
                    </tr>
                `;
                
                const url = `${CONFIG.api.baseUrl}/email/history`;
                console.log('[loadHistory] Fetching general history from:', url);
                
                const response = await fetch(url);
                console.log('[loadHistory] Response status:', response.status, response.ok);
                
                if (!response.ok) {
                    throw new Error(`History not available: ${response.status}`);
                }
                
                const history = await response.json();
                console.log('[loadHistory] Received history:', history);

                if (!history || history.length === 0) {
                    console.log('[loadHistory] No history found, showing empty state');
                    tbody.innerHTML = `<tr><td colspan="5" class="empty-state">No emails sent yet</td></tr>`;
                    return;
                }

                console.log('[loadHistory] Rendering', history.length, 'history items');
                tbody.innerHTML = history.slice(0, 10).map(email => {
                    const date = new Date(email.sentAt).toLocaleDateString();
                    const statusClass = email.status === 'completed' ? 'success' :
                                       email.status === 'completed-with-errors' ? 'warning' : 'error';
                    const statusText = email.status === 'completed' ? 'Sent' :
                                      email.status === 'completed-with-errors' ? 'Partial' : email.status;

                    return `
                        <tr>
                            <td>${date}</td>
                            <td>${email.subject || '-'}</td>
                            <td>${email.templateId || '-'}</td>
                            <td>${email.results?.sent || 0}/${email.recipientCount || 0}</td>
                            <td><span class="badge badge-${statusClass}">${statusText}</span></td>
                        </tr>
                    `;
                }).join('');
                console.log('[loadHistory] History rendered successfully');
            } catch (error) {
                console.error('[loadHistory] Error loading history:', error);
                document.getElementById('history-body').innerHTML = `<tr><td colspan="5" class="empty-state">No emails sent yet</td></tr>`;
            }
        }

        function displayUserTimezone() {
            const offset = new Date().getTimezoneOffset();
            const hours = Math.abs(Math.floor(offset / 60));
            const minutes = Math.abs(offset % 60);
            const sign = offset <= 0 ? '+' : '-';
            const tzDisplay = `(GMT${sign}${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')})`;
            const tzElement = document.getElementById('timezone-display');
            if (tzElement) {
                tzElement.textContent = tzDisplay;
            }
        }

        function updateSchedulePreview() {
            const scheduleInput = document.getElementById('scheduled-send-time').value;
            const preview = document.getElementById('schedule-preview');
            
            if (!scheduleInput) {
                preview.style.display = 'none';
                return;
            }
            
            const localDate = new Date(scheduleInput);
            const utcDate = localDate.toISOString();
            
            const offset = localDate.getTimezoneOffset();
            const hours = Math.abs(Math.floor(offset / 60));
            const minutes = Math.abs(offset % 60);
            const sign = offset <= 0 ? '+' : '-';
            const gmtOffset = `GMT${sign}${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
            
            preview.innerHTML = `📅 Will send on: <strong>${localDate.toLocaleString()}</strong> (${gmtOffset})<br>UTC: ${utcDate}`;
            preview.style.display = 'block';
        }
        
        function lockFormFields(lock) {
            // Lock/unlock form fields
            document.getElementById('subject').readOnly = lock;
            document.getElementById('cta-url').readOnly = lock;
            document.getElementById('cta-text').readOnly = lock;
            document.getElementById('scheduled-send-time').disabled = lock;
            quill.enable(!lock);
            
            // Apply visual locked state to editor
            const editorContainer = document.getElementById('editor-container');
            if (lock) {
                editorContainer.style.opacity = '1';
                editorContainer.style.background = '';
                // Overlay to visually block editing
                let overlay = document.getElementById('editor-lock-overlay');
                if (!overlay) {
                    overlay = document.createElement('div');
                    overlay.id = 'editor-lock-overlay';
                    overlay.style.cssText = 'position:absolute;top:0;left:0;right:0;bottom:0;z-index:10;cursor:not-allowed;';
                    editorContainer.style.position = 'relative';
                    editorContainer.appendChild(overlay);
                }
                overlay.style.display = 'block';
            } else {
                const overlay = document.getElementById('editor-lock-overlay');
                if (overlay) overlay.style.display = 'none';
            }
            
            // Lock/unlock template cards
            document.querySelectorAll('.template-card').forEach(card => {
                card.style.pointerEvents = lock ? 'none' : 'auto';
                card.style.opacity = lock ? '0.6' : '1';
            });
            
            // Show/hide message
            if (lock) {
                showStatus('Email is live — switch to Draft to make changes', 'warning');
            }
        }

        function showStatus(message, type) {
            const bar = document.getElementById('status-bar');
            bar.textContent = message;
            bar.className = `status-bar ${type}`;

            if (type === 'success') {
                setTimeout(() => {
                    bar.className = 'status-bar';
                }, 5000);
            }
        }
    </script>
