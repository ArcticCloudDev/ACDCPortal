<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Composer - ACDC Committee</title>
    <link rel="stylesheet" href="css/admin-styles.css">
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <style>
        /* Page-specific styles */

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 220px;
            padding: 24px 32px;
        }

        .page-header {
            margin-bottom: 20px;
        }

        .page-title { font-size: 1.5rem; font-weight: 600; color: var(--admin-sidebar); margin: 0; }

        /* Status Bar */
        .status-bar {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        .status-bar.error { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; display: block; }
        .status-bar.success { background: #dcfce7; border: 1px solid #86efac; color: #166534; display: block; }
        .status-bar.warning { background: #fef3c7; border: 1px solid #fde68a; color: #92400e; display: block; }

        /* Email Container */
        .email-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        /* Panels */
        .panel {
            background: white;
            border-radius: 8px;
            border: 1px solid var(--admin-border);
        }

        .panel-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--admin-border);
            font-weight: 600;
            color: var(--admin-sidebar);
        }

        .panel-body { padding: 18px; }

        /* Form Elements */
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 0.85rem; }

        .form-group input[type="text"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--admin-border);
            border-radius: 6px;
            font-size: 0.875rem;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--admin-primary);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }

        /* Template Cards */
        .template-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .template-card {
            padding: 12px 8px;
            border: 2px solid var(--admin-border);
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s;
        }

        .template-card:hover { border-color: var(--admin-primary); }
        .template-card.selected { border-color: var(--admin-primary); background: rgba(59,130,246,0.05); }
        .template-card .icon { font-size: 1.25rem; margin-bottom: 4px; }
        .template-card .name { font-size: 0.7rem; font-weight: 500; }

        /* Recipient Info */
        .recipient-info {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            padding: 4px 10px;
            background: #dbeafe;
            color: #1d4ed8;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        /* Custom Recipients */
        .custom-recipients { display: none; margin-top: 8px; }
        .custom-recipients.visible { display: block; }
        .custom-recipients textarea { height: 80px; font-family: monospace; font-size: 0.8rem; }

        /* Quill Editor */
        #editor-container { height: 200px; background: white; }
        .ql-toolbar { border-radius: 6px 6px 0 0 !important; background: #f8fafc; }
        .ql-container { border-radius: 0 0 6px 6px !important; }

        /* Preview Frame */
        .preview-frame {
            width: 100%;
            height: calc(100vh - 200px);
            min-height: 500px;
            border: 1px solid var(--admin-border);
            border-radius: 6px;
            background: white;
        }

        /* Buttons */
        .btn-row { display: flex; gap: 10px; margin-top: 16px; }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-primary { background: var(--admin-primary); color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-secondary { background: var(--admin-border); color: var(--admin-text); }
        .btn-secondary:hover { background: #cbd5e1; }

        .btn-sm {
            padding: 5px 10px;
            font-size: 0.75rem;
            border-radius: 4px;
            border: 1px solid var(--admin-border);
            background: white;
            color: var(--admin-text);
            cursor: pointer;
        }
        .btn-sm:hover { background: var(--admin-bg); }

        /* History Section */
        .history-section { margin-top: 24px; }

        .data-table { width: 100%; border-collapse: collapse; }

        .data-table th {
            text-align: left;
            padding: 10px 16px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--admin-text-muted);
            background: var(--admin-bg);
            border-bottom: 1px solid var(--admin-border);
        }

        .data-table td {
            padding: 10px 16px;
            border-bottom: 1px solid var(--admin-border);
            font-size: 0.85rem;
        }

        .data-table tbody tr:hover { background: var(--admin-bg); }

        .badge {
            display: inline-flex;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 500;
            text-transform: uppercase;
        }

        .badge-success { background: #dcfce7; color: #166534; }
        .badge-warning { background: #fef3c7; color: #92400e; }
        .badge-error { background: #fee2e2; color: #991b1b; }

        .empty-state { text-align: center; padding: 30px; color: var(--admin-text-muted); }
    </style>
</head>
<body>
    <div class="admin-layout">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div class="page-header">
                <h1 class="page-title">Email Composer</h1>
            </div>

            <div id="status-bar" class="status-bar"></div>

            <div class="email-container">
                <!-- Compose Panel -->
                <div class="panel">
                    <div class="panel-header">Compose Email</div>
                    <div class="panel-body">
                        <div class="form-group">
                            <label>Template</label>
                            <div class="template-grid" id="template-cards">
                                <div class="template-card selected" data-template="announcement">
                                    <div class="icon">📢</div>
                                    <div class="name">Announcement</div>
                                </div>
                                <div class="template-card" data-template="reminder">
                                    <div class="icon">⏰</div>
                                    <div class="name">Reminder</div>
                                </div>
                                <div class="template-card" data-template="welcome">
                                    <div class="icon">🎉</div>
                                    <div class="name">Welcome</div>
                                </div>
                                <div class="template-card" data-template="invitation">
                                    <div class="icon">✉️</div>
                                    <div class="name">Invitation</div>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="subject">Subject</label>
                            <input type="text" id="subject" placeholder="Enter email subject...">
                        </div>

                        <div class="form-group">
                            <label>Target Event</label>
                            <select id="event-select" style="width: 100%;">
                                <option value="">Loading events...</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Recipients</label>
                            <select id="recipient-filter" style="width: 100%;">
                                <option value="all-participants">All Participants</option>
                                <option value="team-admins">Team Admins Only</option>
                                <option value="team-members">Team Members (non-admins)</option>
                                <option value="solo-queue">Solo Queue Participants</option>
                                <option value="pending-invites">Pending Invitations</option>
                                <option value="interest-queue">Interest Queue (No Event)</option>
                                <option value="custom">Custom List</option>
                            </select>
                            <div class="custom-recipients" id="custom-recipients">
                                <textarea id="custom-emails" placeholder="Enter email addresses, one per line..."></textarea>
                            </div>
                            <div class="recipient-info">
                                <span id="recipient-count">0</span> recipients selected
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Message Content</label>
                            <div id="editor-container"></div>
                        </div>

                        <div class="form-group">
                            <label for="cta-url">Call-to-Action URL (optional)</label>
                            <input type="text" id="cta-url" placeholder="https://...">
                        </div>

                        <div class="form-group">
                            <label for="cta-text">Button Text</label>
                            <input type="text" id="cta-text" placeholder="Learn More" value="Learn More">
                        </div>

                        <div class="btn-row">
                            <button class="btn btn-secondary" onclick="previewEmail()">👁️ Preview</button>
                            <button class="btn btn-primary" onclick="sendEmail()">📤 Send Email</button>
                        </div>
                    </div>
                </div>

                <!-- Preview Panel -->
                <div class="panel">
                    <div class="panel-header">Preview</div>
                    <div class="panel-body" style="padding: 0;">
                        <iframe id="preview-frame" class="preview-frame"></iframe>
                    </div>
                </div>
            </div>

            <!-- History Section -->
            <div class="history-section">
                <div class="panel">
                    <div class="panel-header">Send History</div>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Subject</th>
                                <th>Template</th>
                                <th>Recipients</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="history-body">
                            <tr><td colspan="5" class="empty-state">Loading history...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
    <script src="https://unpkg.com/quill-image-resize-module@3.0.0/image-resize.min.js"></script>
    <script src="https://unpkg.com/quill-image-drop-module@1.0.3/image-drop.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/admin-sidebar.js"></script>
    <script>
        let quill;
        let selectedTemplate = 'announcement';
        let recipients = [];
        let allEvents = [];

        document.addEventListener('DOMContentLoaded', async () => {
            renderAdminSidebar('email');
            
            // Initialize rich text editor
            quill = new Quill('#editor-container', {
                theme: 'snow',
                placeholder: 'Write your message here...',
                modules: {
                    toolbar: [
                        ['bold', 'italic', 'underline'],
                        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                        ['link', 'image'],
                        ['clean']
                    ],
                    imageResize: {},
                    imageDrop: true
                }
            });

            // Template selection
            document.querySelectorAll('.template-card').forEach(card => {
                card.addEventListener('click', () => {
                    document.querySelectorAll('.template-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    selectedTemplate = card.dataset.template;
                    previewEmail();
                });
            });

            // Event selection change
            document.getElementById('event-select').addEventListener('change', () => {
                loadRecipients();
            });

            // Recipient filter change
            document.getElementById('recipient-filter').addEventListener('change', (e) => {
                const customRecipients = document.getElementById('custom-recipients');
                customRecipients.classList.toggle('visible', e.target.value === 'custom');

                if (e.target.value !== 'custom') {
                    loadRecipients();
                }
            });

            document.getElementById('custom-emails').addEventListener('input', parseCustomEmails);

            // Auto-preview on content change
            quill.on('text-change', debounce(previewEmail, 500));
            document.getElementById('subject').addEventListener('input', debounce(previewEmail, 500));
            document.getElementById('cta-url').addEventListener('input', debounce(previewEmail, 500));
            document.getElementById('cta-text').addEventListener('input', debounce(previewEmail, 500));

            // Initial load
            await loadEvents();
            await loadRecipients();
            await loadHistory();
            previewEmail();
        });

        async function loadEvents() {
            try {
                const response = await fetch(`${CONFIG.api.baseUrl}/events`);
                if (response.ok) {
                    allEvents = await response.json();
                    const select = document.getElementById('event-select');
                    
                    // Sort: active first, then by date
                    allEvents.sort((a, b) => {
                        if (a.isActive && !b.isActive) return -1;
                        if (!a.isActive && b.isActive) return 1;
                        return new Date(b.startDate) - new Date(a.startDate);
                    });

                    select.innerHTML = allEvents.map(event => 
                        `<option value="${event.id}" ${event.isActive ? 'selected' : ''}>${event.name}${event.isActive ? ' (Active)' : ''}</option>`
                    ).join('');

                    if (allEvents.length === 0) {
                        select.innerHTML = '<option value="">No events found</option>';
                    }
                }
            } catch (error) {
                console.error('Error loading events:', error);
                document.getElementById('event-select').innerHTML = '<option value="">Error loading events</option>';
            }
        }

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        async function loadRecipients() {
            const eventId = document.getElementById('event-select').value;
            const filter = document.getElementById('recipient-filter').value;

            // Interest queue doesn't require an event
            if (filter === 'interest-queue') {
                try {
                    const response = await fetch(`${CONFIG.api.baseUrl}/interest-queue`);
                    if (!response.ok) throw new Error('Failed to load');
                    const entries = await response.json();
                    // Only include non-registered entries
                    recipients = entries
                        .filter(e => !e.registeredEventId)
                        .map(e => ({
                            email: e.email,
                            displayName: [e.firstName, e.lastName].filter(Boolean).join(' ') || e.email
                        }));
                    document.getElementById('recipient-count').textContent = recipients.length;
                } catch (error) {
                    console.error('Error loading interest queue:', error);
                    recipients = [];
                    document.getElementById('recipient-count').textContent = '0';
                }
                return;
            }

            if (!eventId) {
                recipients = [];
                document.getElementById('recipient-count').textContent = '0';
                return;
            }

            try {
                const response = await fetch(`${CONFIG.api.baseUrl}/email/recipients?eventId=${eventId}&filter=${filter}`);
                if (!response.ok) throw new Error('Failed to load');
                recipients = await response.json();
                document.getElementById('recipient-count').textContent = recipients.length;
            } catch (error) {
                console.error('Error loading recipients:', error);
                recipients = [];
                document.getElementById('recipient-count').textContent = '0';
            }
        }

        function parseCustomEmails() {
            const text = document.getElementById('custom-emails').value;
            const emails = text.split('\n')
                .map(e => e.trim())
                .filter(e => e && e.includes('@'));
            recipients = emails.map(email => ({ email }));
            document.getElementById('recipient-count').textContent = recipients.length;
        }

        async function previewEmail() {
            const subject = document.getElementById('subject').value || 'Email Subject';
            const content = quill.root.innerHTML;
            const ctaUrl = document.getElementById('cta-url').value;
            const ctaText = document.getElementById('cta-text').value || 'Learn More';

            try {
                const response = await fetch(`${CONFIG.api.baseUrl}/email/preview`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        templateId: selectedTemplate,
                        data: {
                            subject: subject,
                            firstName: 'Preview User',
                            content: content,
                            ctaUrl: ctaUrl,
                            ctaText: ctaText
                        }
                    })
                });

                if (response.ok) {
                    const result = await response.json();
                    const frame = document.getElementById('preview-frame');
                    frame.srcdoc = result.html;
                }
            } catch (error) {
                console.error('Error previewing email:', error);
            }
        }

        async function sendEmail() {
            if (recipients.length === 0) {
                showStatus('Please select recipients', 'error');
                return;
            }

            const subject = document.getElementById('subject').value;
            if (!subject) {
                showStatus('Please enter a subject', 'error');
                return;
            }

            if (!confirm(`Send email to ${recipients.length} recipient(s)?`)) {
                return;
            }

            try {
                const response = await fetch(`${CONFIG.api.baseUrl}/email/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        templateId: selectedTemplate,
                        subject,
                        content: quill.root.innerHTML,
                        ctaUrl: document.getElementById('cta-url').value,
                        ctaText: document.getElementById('cta-text').value || 'Learn More',
                        recipients: recipients.map(r => ({
                            email: r.email,
                            name: r.displayName || r.email
                        }))
                    })
                });

                const result = await response.json();

                if (result.results.failed === 0) {
                    showStatus(`✅ Successfully sent to ${result.results.sent} recipient(s)`, 'success');
                } else {
                    showStatus(`⚠️ Sent: ${result.results.sent}, Failed: ${result.results.failed}`, 'warning');
                }

                await loadHistory();
            } catch (error) {
                console.error('Error sending email:', error);
                showStatus('Error sending email: ' + error.message, 'error');
            }
        }

        async function loadHistory() {
            try {
                const response = await fetch(`${CONFIG.api.baseUrl}/email/history`);
                if (!response.ok) {
                    throw new Error('History not available');
                }
                const history = await response.json();

                const tbody = document.getElementById('history-body');

                if (!history || history.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="empty-state">No emails sent yet</td></tr>`;
                    return;
                }

                tbody.innerHTML = history.slice(0, 10).map(email => {
                    const date = new Date(email.sentAt).toLocaleDateString();
                    const statusClass = email.status === 'completed' ? 'success' :
                                       email.status === 'completed-with-errors' ? 'warning' : 'error';
                    const statusText = email.status === 'completed' ? 'Sent' :
                                      email.status === 'completed-with-errors' ? 'Partial' : email.status;

                    return `
                        <tr>
                            <td>${date}</td>
                            <td>${email.subject || '-'}</td>
                            <td>${email.templateId || '-'}</td>
                            <td>${email.results?.sent || 0}/${email.recipientCount || 0}</td>
                            <td><span class="badge badge-${statusClass}">${statusText}</span></td>
                        </tr>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading history:', error);
                document.getElementById('history-body').innerHTML = `<tr><td colspan="5" class="empty-state">No emails sent yet</td></tr>`;
            }
        }

        function showStatus(message, type) {
            const bar = document.getElementById('status-bar');
            bar.textContent = message;
            bar.className = `status-bar ${type}`;

            if (type === 'success') {
                setTimeout(() => {
                    bar.className = 'status-bar';
                }, 5000);
            }
        }
    </script>
</body>
</html>
