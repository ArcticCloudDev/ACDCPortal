<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>People - ACDC Admin</title>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/admin-styles.css">
</head>
<body class="page-people">
    <div class="admin-layout">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div id="loading" class="acdc-loader">
                <div class="loader-spinner"></div>
                <div class="loader-text">Loading people...</div>
            </div>

            <div id="admin-content" class="hidden">

                <div class="page-header">
                    <div>
                        <h1 class="page-title">People</h1>
                        <p class="page-subtitle">Participants, judges, committee members, interest leads and pending invitations across your events.</p>
                    </div>
                    <div class="page-header-actions">
                        <button type="button" class="btn btn-secondary" id="export-csv-btn"><svg class="icon" aria-hidden="true" focusable="false"><use href="/images/icons.svg#download"></use></svg>Export CSV</button>
                    </div>
                </div>

                <div class="toolbar people-toolbar" role="search">
                    <div class="search-field">
                        <svg class="icon" aria-hidden="true" focusable="false"><use href="/images/icons.svg#search"></use></svg>
                        <input type="search" id="filter-search" placeholder="Search name, email, team or event" aria-label="Search people">
                    </div>

                    <select id="filter-event" aria-label="Event">
                        <option value="">All events</option>
                    </select>

                    <select id="filter-group" aria-label="Role">
                        <option value="">All roles</option>
                        <option value="participant">Participants</option>
                        <option value="judge">Judges</option>
                        <option value="committee">Committee</option>
                        <option value="interest">Interest only</option>
                        <option value="invited">Invited (pending)</option>
                        <option value="no-account">No account yet</option>
                    </select>

                    <select id="filter-team" aria-label="Team">
                        <option value="">All teams</option>
                    </select>

                    <div class="toolbar-right">
                        <div class="segmented" role="group" aria-label="Layout">
                            <button type="button" id="view-flat" class="active" aria-pressed="true"><svg class="icon" aria-hidden="true" focusable="false"><use href="/images/icons.svg#list"></use></svg>List</button>
                            <button type="button" id="view-event" aria-pressed="false"><svg class="icon" aria-hidden="true" focusable="false"><use href="/images/icons.svg#calendar-days"></use></svg>By event</button>
                        </div>
                    </div>
                </div>

                <div class="pill-group people-quick-filters" id="stats-row" role="group" aria-label="Filter by role"></div>

                <div id="interest-share-bar" class="notice share-bar hidden">
                    <svg class="icon" aria-hidden="true" focusable="false"><use href="/images/icons.svg#link"></use></svg>
                    <div class="share-bar-content">
                        <div class="notice-title">Interest sign-up link</div>
                        <div class="notice-body">Share this link so people can register interest before registration opens.</div>
                        <div class="input-group">
                            <input type="text" id="share-link" readonly aria-label="Interest sign-up link">
                            <button type="button" class="btn btn-secondary" id="copy-share-link-btn">Copy link</button>
                        </div>
                    </div>
                </div>

                <section class="panel">
                    <div class="panel-header">
                        <h2 class="panel-title" id="panel-title">All people</h2>
                        <span class="badge count" id="panel-count"></span>
                    </div>
                    <div class="panel-body">
                        <table class="data-table people-table" id="main-table">
                            <thead id="main-thead"></thead>
                            <tbody id="main-tbody">
                                <tr><td colspan="6" class="empty-state">Loading…</td></tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <div class="drawer-backdrop" id="drawer-backdrop"></div>
    <div class="drawer" id="person-drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-name">
        <div class="drawer-header">
            <div class="avatar avatar-lg" id="drawer-avatar" aria-hidden="true"></div>
            <div class="drawer-info">
                <h2 id="drawer-name"></h2>
                <div class="drawer-email" id="drawer-email"></div>
                <span class="badge" id="drawer-status-pill"></span>
            </div>
            <button type="button" class="modal-close" id="drawer-close-btn" aria-label="Close"><svg class="icon" aria-hidden="true" focusable="false"><use href="/images/icons.svg#x"></use></svg></button>
        </div>
        <div class="drawer-actions">
            <a class="btn-sm" id="drawer-person-link" href="admin-person.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="/images/icons.svg#user-round"></use></svg>Open person page</a>
        </div>
        <div class="drawer-stats" id="drawer-stats"></div>
        <div class="drawer-body" id="drawer-body"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin-utils.js"></script>
    <script src="js/admin-sidebar.js"></script>
    <script src="js/permissions.js"></script>
    <script src="js/admin-users.js"></script>
</body>
</html>
