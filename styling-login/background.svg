<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky gradient background -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1a365d"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    
    <!-- Aurora effect -->
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#06b6d4;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#22c55e;stop-opacity:0.4"/>
      <stop offset="70%" style="stop-color:#06b6d4;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#skyGradient)"/>
  
  <!-- Aurora band -->
  <ellipse cx="960" cy="200" rx="800" ry="150" fill="url(#aurora)" opacity="0.5"/>
  <ellipse cx="1100" cy="250" rx="600" ry="100" fill="url(#aurora)" opacity="0.3"/>
  
  <!-- Stars -->
  <g fill="#f8fafc">
    <circle cx="100" cy="80" r="1.5" opacity="0.8"/>
    <circle cx="250" cy="120" r="1" opacity="0.6"/>
    <circle cx="400" cy="60" r="2" opacity="0.9"/>
    <circle cx="550" cy="150" r="1" opacity="0.5"/>
    <circle cx="700" cy="90" r="1.5" opacity="0.7"/>
    <circle cx="850" cy="40" r="1" opacity="0.6"/>
    <circle cx="1000" cy="100" r="2" opacity="0.8"/>
    <circle cx="1150" cy="70" r="1" opacity="0.5"/>
    <circle cx="1300" cy="130" r="1.5" opacity="0.7"/>
    <circle cx="1450" cy="50" r="1" opacity="0.6"/>
    <circle cx="1600" cy="110" r="2" opacity="0.9"/>
    <circle cx="1750" cy="80" r="1" opacity="0.5"/>
    <circle cx="1850" cy="140" r="1.5" opacity="0.7"/>
    <circle cx="180" cy="200" r="1" opacity="0.4"/>
    <circle cx="320" cy="180" r="1.5" opacity="0.6"/>
    <circle cx="620" cy="220" r="1" opacity="0.5"/>
    <circle cx="920" cy="190" r="1" opacity="0.4"/>
    <circle cx="1220" cy="210" r="1.5" opacity="0.6"/>
    <circle cx="1520" cy="170" r="1" opacity="0.5"/>
    <circle cx="1800" cy="230" r="1" opacity="0.4"/>
  </g>
  
  <!-- Mountain range - far background -->
  <polygon points="0,900 200,700 400,850 600,650 800,800 1000,600 1200,750 1400,620 1600,780 1800,680 1920,800 1920,1080 0,1080" 
           fill="#1e3a5f" opacity="0.5"/>
  
  <!-- Mountain range - middle -->
  <polygon points="0,950 150,800 350,900 500,750 700,880 900,700 1100,850 1300,720 1500,860 1700,780 1920,880 1920,1080 0,1080" 
           fill="#2d4a6f" opacity="0.7"/>
  
  <!-- Mountain range - foreground -->
  <polygon points="0,1000 100,850 250,950 400,800 550,920 700,780 850,900 1000,750 1150,880 1300,800 1450,920 1600,830 1750,950 1920,870 1920,1080 0,1080" 
           fill="#1a365d"/>
  
  <!-- Snow caps on foreground mountains -->
  <polygon points="400,800 370,850 430,850" fill="#f8fafc" opacity="0.9"/>
  <polygon points="700,780 660,840 740,840" fill="#f8fafc" opacity="0.9"/>
  <polygon points="1000,750 950,820 1050,820" fill="#f8fafc" opacity="0.9"/>
  <polygon points="1300,800 1260,860 1340,860" fill="#f8fafc" opacity="0.9"/>
  <polygon points="1600,830 1560,890 1640,890" fill="#f8fafc" opacity="0.9"/>
  
  <!-- Ground snow/ice -->
  <rect x="0" y="1020" width="1920" height="60" fill="#e2e8f0" opacity="0.3"/>
</svg>
