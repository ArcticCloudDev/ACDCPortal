<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="120" cy="120" r="110" fill="#1a365d"/>
  
  <!-- Arctic Mountain -->
  <g transform="translate(40, 50)">
    <!-- Main Mountain -->
    <polygon points="80,130 20,130 80,30 140,130" fill="#f8fafc"/>
    <!-- Snow shadow -->
    <polygon points="80,30 60,70 100,70" fill="#e2e8f0"/>
    <!-- Second peak -->
    <polygon points="120,130 80,60 160,130" fill="#3b82f6"/>
    <polygon points="120,60 100,90 140,90" fill="#f8fafc"/>
  </g>
  
  <!-- ACDC Text at bottom -->
  <text x="120" y="210" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    ACDC
  </text>
</svg>
